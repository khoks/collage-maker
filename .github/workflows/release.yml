name: Release

# Push a tag like v1.2.3 (matching the VERSION file) to publish a release:
#   1. build the zip, tar.gz and .deb and publish them as a GitHub release,
#   2. point the Homebrew formula and the Scoop manifest at the new files (commit to main),
#   3. install the published release through every channel on Linux, macOS and Windows.

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to re-verify (for example v1.0.0)
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  FORCE_COLOR: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

jobs:
  publish:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check the tag matches VERSION
        id: version
        run: |
          version=$(cat VERSION)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match VERSION ($version)"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        run: node scripts/build.mjs
      - name: Check the Debian package
        run: |
          sudo apt-get update
          sudo apt-get install -y lintian
          lintian --fail-on error --suppress-tags no-manual-page dist/collage-maker.deb
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-notes.mjs "${{ steps.version.outputs.version }}" > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --title "Collage Maker ${{ steps.version.outputs.version }}" \
            --notes-file "$RUNNER_TEMP/notes.md"

  update-packages:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Point Homebrew and Scoop at the new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ needs.publish.outputs.version }}
          gh release download "v$version" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          node scripts/update-packages.mjs "$version" "$RUNNER_TEMP/SHA256SUMS"
          if git diff --quiet; then
            echo "Formula and manifest already point at $version"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -am "Point Homebrew and Scoop at $version"
          git push origin HEAD:main

  # ---------------------------------------------------------------------------------------------
  # Install the published release the way users will.
  verify-linux:
    needs: update-packages
    if: ${{ !cancelled() && (needs.update-packages.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    steps:
      - name: Debian package from the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=${{ inputs.tag || github.ref_name }}
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern collage-maker.deb --dir "$RUNNER_TEMP"
          sudo apt-get install -y "$RUNNER_TEMP/collage-maker.deb"
          collage-maker --version
          collage-maker --dry-run
          sudo apt-get remove -y collage-maker
      - name: install.sh from main
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | sh
          ~/.local/bin/collage-maker --version
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | sh -s -- --uninstall
          test ! -e ~/.local/bin/collage-maker
      - name: Homebrew on Linux from the tap
        run: |
          eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"
          brew tap khoks/collage-maker "https://github.com/$GITHUB_REPOSITORY"
          brew install khoks/collage-maker/collage-maker
          brew test khoks/collage-maker/collage-maker
          collage-maker --version

  verify-macos:
    needs: update-packages
    if: ${{ !cancelled() && (needs.update-packages.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: macos-latest
    steps:
      - name: Homebrew from the tap
        run: |
          brew tap khoks/collage-maker "https://github.com/$GITHUB_REPOSITORY"
          brew install khoks/collage-maker/collage-maker
          brew test khoks/collage-maker/collage-maker
          brew audit --strict --online khoks/collage-maker/collage-maker
          collage-maker --version
          collage-maker --dry-run
          collage-maker --install-shortcut
          plutil -lint "$HOME/Applications/Collage Maker.app/Contents/Info.plist"
          collage-maker --uninstall-shortcut
          brew uninstall --formula collage-maker
      - name: install.sh from main
        run: |
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | sh
          test -d "$HOME/Applications/Collage Maker.app"
          curl -fsSL "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh" | sh -s -- --uninstall
          test ! -e "$HOME/Applications/Collage Maker.app"

  verify-windows:
    needs: update-packages
    if: ${{ !cancelled() && (needs.update-packages.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - name: install.ps1 from main (irm | iex)
        shell: powershell
        run: |
          $env:CI = 'true'
          irm "https://raw.githubusercontent.com/$env:GITHUB_REPOSITORY/main/install.ps1" | iex
          $dir = Join-Path $env:LOCALAPPDATA 'Programs\Collage Maker'
          & cmd.exe /d /c "`"$dir\collage-maker.cmd`" --version"
          $reg = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\CollageMaker'
          & cmd.exe /d /s /c $reg.UninstallString
          if (Test-Path $dir) { throw 'uninstall left files behind' }
      - name: Scoop bucket
        shell: pwsh
        run: |
          irm get.scoop.sh | iex
          $env:PATH = "$env:USERPROFILE\scoop\shims;$env:PATH"
          scoop bucket add collage-maker "https://github.com/$env:GITHUB_REPOSITORY"
          scoop install collage-maker
          collage-maker --version
          $lnk = Join-Path ([Environment]::GetFolderPath('Programs')) 'Scoop Apps\Collage Maker.lnk'
          if (-not (Test-Path $lnk)) { throw 'Scoop did not create the Start menu shortcut' }
          scoop uninstall collage-maker
          if (Test-Path $lnk) { throw 'Scoop uninstall left the shortcut behind' }
